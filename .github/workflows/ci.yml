name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils make curl

      - name: Build
        run: |
          make clean
          make -j"$(nproc)"

      - name: Check
        run: make check

      - name: Smoke test
        run: make smoke

      - name: Inspect binary
        run: |
          file build/asmory-registry
          size build/asmory-registry
          readelf -h build/asmory-registry
