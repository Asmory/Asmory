name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils make curl

      - name: Build
        run: |
          make clean
          make -j"$(nproc)"

      - name: Check binaries
        run: make check

      - name: Registry smoke test
        run: make smoke

      - name: CLI smoke test
        run: make cli-smoke

      - name: Host target report
        run: ./build/asmory target

      - name: ELF inspection
        run: |
          file build/asmory build/asmory-registry
          size build/asmory build/asmory-registry
          readelf -h build/asmory
          readelf -h build/asmory-registry
