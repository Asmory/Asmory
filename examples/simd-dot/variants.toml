[[variant]]
id = "x86_64-avx2-fma-4acc"
conformance_suite = "core-v1-basic"
contract = "asmory/simd-dot-core@1.0.0"
capability = "math.dot.f32"
provider = "Asmory/Asmory"

[variant.compatibility]
arch = "x86_64"
os = "linux"
object = "elf64"
abi = "sysv64"
baseline = "x86-64-v3"
required = ["avx2", "fma"]

[variant.tuning]
strategy = "four-independent-fma-accumulators"
microarch = []

[variant.performance]
contract = "performance.toml"
status = "experimental"
