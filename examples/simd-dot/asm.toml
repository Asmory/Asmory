[package]
name = "simd-dot"
version = "0.1.0"
license = "MIT"
description = "AVX2/FMA float32 dot-product kernel"
readme = "README.md"
repository = "https://github.com/Asmory/Asmory"
homepage = "https://asmory.github.io/Asmory/"
keywords = ["simd", "dot-product", "avx2", "fma"]
categories = ["math", "simd"]

[semantics]
capability = "math.dot.f32"
contract = "asmory/simd-dot-core@1.0.0"

[target]
arch = "x86_64"
os = "linux"
object = "elf64"
abi = "sysv64"

[target.isa]
baseline = "x86-64-v3"
required = ["avx2", "fma"]
optional = []

[toolchain]
assembler = "gas"
min_version = "2.40"
syntax = "intel"

[build]
sources = ["src/dot.S"]

[link]
gc_sections = true
pic = false

[exports.simd_dot_f32]
symbol = "simd_dot_f32"
section = ".text.simd_dot_f32"
calling_convention = "sysv64"
