schema = 1

[suite]
id = "core-v1-basic"
profile = "asmory/simd-dot-core@1.0.0"
runner = "basic.S"

[[suite.facets]]
path = "interface.shape"
tests = ["call-shape"]

[[suite.facets]]
path = "requires.memory.alignment_min_bytes"
tests = ["unaligned-input"]

[[suite.facets]]
path = "guarantees.memory.inputs_written"
tests = ["input-preservation"]

[[suite.facets]]
path = "guarantees.memory.out_of_bounds_access"
tests = ["bounded-length-cases"]

[[suite.facets]]
path = "guarantees.numeric.absolute_error_max"
tests = ["known-dot-cases"]

[[suite.facets]]
path = "guarantees.numeric.relative_error_max"
tests = ["known-dot-cases"]

[[suite.facets]]
path = "guarantees.determinism.level"
tests = ["repeat-same-machine"]
